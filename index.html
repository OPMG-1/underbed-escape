// 외부 파일 없이 Web Audio로 생성하는 저음 앰비언스. 사용자 클릭 후에만 재생한다.
const sound={ctx:null,master:null,ambience:null,enabled:false,osc:[],timer:null,sfxGain:null,bgmGain:null,bgmVolume:.65,sfxVolume:.8};
function initSound(){
 if(sound.ctx)return;
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const ctx=sound.ctx=new AC();
 const master=sound.master=ctx.createGain();master.gain.value=0;const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-14;limiter.knee.value=12;limiter.ratio.value=8;limiter.attack.value=.003;limiter.release.value=.18;master.connect(limiter);limiter.connect(ctx.destination);
 const low=ctx.createBiquadFilter();low.type='lowpass';low.frequency.value=380;low.connect(master);
 const bgm=sound.bgmGain=ctx.createGain();bgm.gain.value=sound.bgmVolume;bgm.connect(low);const amb=sound.ambience=ctx.createGain();amb.gain.value=.25;amb.connect(bgm);const sfx=sound.sfxGain=ctx.createGain();sfx.gain.value=sound.sfxVolume;sfx.connect(master);
 [[55,.055],[82.41,.025],[110,.012]].forEach(([hz,vol],i)=>{
   const o=ctx.createOscillator(),g=ctx.createGain();o.type=i===1?'triangle':'sine';o.frequency.value=hz;g.gain.value=vol;o.connect(g);g.connect(amb);o.start();sound.osc.push(o);
 });
 const lfo=ctx.createOscillator(),depth=ctx.createGain();lfo.frequency.value=.085;depth.gain.value=.06;lfo.connect(depth);depth.connect(amb.gain);lfo.start();sound.osc.push(lfo);
}
function tone(freq=250,duration=.13,volume=.028,type='sine'){
 if(!sound.enabled||!sound.ctx)return;
 const c=sound.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*.72),c.currentTime+duration);
 g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(volume,c.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+duration);
 o.connect(g);g.connect(sound.sfxGain);o.start();o.stop(c.currentTime+duration+.02);
}
// 불규칙한 간격으로 발생하는 아주 짧은 잡음과 문 두드림. 소리 끄면 예약도 중단.
function burstNoise(duration=.12,volume=.02,cutoff=900){
 if(!sound.enabled||!sound.ctx)return;
 const c=sound.ctx, buffer=c.createBuffer(1,Math.ceil(c.sampleRate*duration),c.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,1.5);
 const src=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain();src.buffer=buffer;filter.type='lowpass';filter.frequency.value=cutoff;
 gain.gain.setValueAtTime(volume,c.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,c.currentTime+duration);
 src.connect(filter);filter.connect(gain);gain.connect(sound.sfxGain);src.start();src.stop(c.currentTime+duration);
}
// 나무 문을 손가락 관절로 두드리는 짧고 둔탁한 충격음.
// 저음 사인파를 길게 울리지 않고, 짧은 대역 제한 잡음으로 만든다.
function knock(){
 if(!sound.enabled||!sound.ctx)return;
 const c=sound.ctx;
 const count=2+Math.floor(Math.random()*2);
 let delay=0;
 for(let i=0;i<count;i++){
  if(i)delay+=.17+Math.random()*.33;
  const t=c.currentTime+delay;
  const duration=.065+Math.random()*.035;
  const buffer=c.createBuffer(1,Math.ceil(c.sampleRate*duration),c.sampleRate);
  const data=buffer.getChannelData(0);
  for(let j=0;j<data.length;j++){
   const x=j/data.length;
   data[j]=(Math.random()*2-1)*Math.exp(-x*9);
  }
  const src=c.createBufferSource();src.buffer=buffer;
  const high=c.createBiquadFilter();high.type='highpass';high.frequency.value=190;
  const low=c.createBiquadFilter();low.type='lowpass';low.frequency.value=1000+Math.random()*250;
  const g=c.createGain();g.gain.value=.32+Math.random()*.07;
  src.connect(high);high.connect(low);low.connect(g);g.connect(sound.sfxGain);
  src.start(t);src.stop(t+duration);
 }
}
function scheduleRoomSounds(){
 clearTimeout(sound.timer);if(!sound.enabled)return;
 // 9~23초 간격. 대부분 노크, 드물게 0.1초 내외의 잡음.
 sound.timer=setTimeout(()=>{
  if(!sound.enabled)return;
  if(Math.random()<.72)knock();else burstNoise(.07+Math.random()*.09,.012+Math.random()*.012,500);
  scheduleRoomSounds();
 },9000+Math.random()*14000);
}
function setSound(on){
 if(on){initSound();if(!sound.ctx){document.getElementById('audio-toggle').textContent='소리 지원 안 됨';return;}sound.ctx.resume();}
 sound.enabled=on;
 if(on)scheduleRoomSounds();else clearTimeout(sound.timer);
 if(sound.ctx){const t=sound.ctx.currentTime;sound.master.gain.cancelScheduledValues(t);sound.master.gain.setTargetAtTime(on?1:0,t,.12)}
 const b=document.getElementById('audio-toggle');b.textContent=on?'♫ 소리 끄기':'♪ 소리 켜기';b.setAttribute('aria-label',on?'배경음 끄기':'배경음 켜기');
}

function where(){state.requestHeard=true;dialogue(['다룬','켈','숄','뮨'],[
 ['그림을 살펴보라는 거야?',()=>dialogue(['다룬','켈','숄'],[['알겠어. 살펴볼게.',close],['다시 말해줘.',where]])],['잘 모르겠어. 다시 말해줘.',where],['대화를 마친다',close]])}
function give(){if(!state.ribbon){showText('빈손','아직 건넬 물건이 없다.');return}state.ribbon=false;state.given=true;state.key=true;note('괴물에게 붉은 리본을 건네고 열쇠를 얻었다.');dialogue(['그륵','바롱','켁','노킴'],[['열쇠를 받는다.',()=>{close();render();showText('녹슨 열쇠','침대 밑에서 열쇠가 미끄러져 나왔다. 정면 문을 열 수 있을 것 같다.')}],['고마워.',()=>{close();render()}]])}
function book(){state.bookSeen=true;state.bookPage=0;note('그림책에는 그림과 반복되는 기호가 있다.');renderBook()}
function renderBook(){state.bookPagesSeen.add(state.bookPage);saveScreen('book');const pg=pages[state.bookPage];const lines=pg.lines.map(a=>`<p style="margin:7px 0;font-size:18px;line-height:2">${tokens(a)}</p>`).join('');panel('낡은 그림책',`<div class="book-page"><div class="illustration">${pg.pic}</div>${lines}<div class="page-counter">${state.bookPage+1} / ${pages.length}</div></div><p class="small">그림을 보고 단어를 눌러 한국어 뜻을 직접 기록해 봐. 같은 기호는 모든 곳에서 함께 바뀐다.</p>`,[['◀ 이전',()=>{state.bookPage=Math.max(0,state.bookPage-1);renderBook()}],['다음 ▶',()=>{state.bookPage=Math.min(pages.length-1,state.bookPage+1);renderBook()}],['책 덮기',close]]);const b=document.querySelectorAll('.actions button');b[0].disabled=state.bookPage===0;b[1].disabled=state.bookPage===pages.length-1}
function normalized(s){return (s||'').toLowerCase().replace(/[\s.,!?~·"']/g,'').replace(/(입니다|이에요|예요|입니다만|합니다|해요|이다|이야|이네|이에요)$/,'')}
const accepted={
 '녷':['붉다','붉은','붉어','빨간','빨강','빨갛다','빨간색','붉은색','적색'],
 '쀨':['천','천조각','헝겊','천으로만든','천으로된','직물','옷감'],
 '뤼핌':['리본','장식리본','리본끈'],
 '투렐':['찾다','찾아줘','찾아주다','찾아주세요','찾아달라','찾아주길바라다']
};
function correct(w){let val=normalized(state.translations[w]);return !!val && (accepted[w]||[]).some(a=>normalized(a)===val)}
function understands(){return ['녷','쀨','뤼핌'].every(correct)}
function picture(){if(state.frame){showText('달 그림','액자 뒤에는 이제 아무것도 없다.');return}
 const buttons=[['액자를 자세히 살핀다',()=>showText('달 그림','액자 아래쪽에 좁은 틈이 보인다. 하지만 이곳에서 무엇을 찾아야 할까?')]];
 if(state.requestHeard && state.bookSeen)buttons.push(['괴물의 말과 그림책을 떠올린다',()=>{
  if(!understands()){showText('아직 연결되지 않는 단서','괴물이 말한 물건이 무엇인지 확신할 수 없다. 그림책에서 반복되는 색, 재질, 물건의 이름을 해독 노트에 기록해 보자.');return}
  if(state.bookPagesSeen.size<3){showText('그림책의 단서','그림책의 다른 장면도 살펴보면 좋겠다.');return}
  panel('무엇을 찾고 있을까?','<p>해독한 단어와 그림책의 그림을 떠올리며 액자를 살핀다.</p>',[
  ['푸른 돌',()=>showText('아무것도 없다','그런 물건은 보이지 않는다.')],
  ['붉은 천 리본',()=>{state.frame=true;state.ribbon=true;note('달 그림 뒤에서 붉은 리본을 발견했다.');render();showText('붉은 리본 발견','액자 뒤에서 붉은 천 리본을 꺼냈다. 괴물에게 가져가 보자.')},true],
  ['작은 나무 인형',()=>showText('아무것도 없다','나무 인형은 보이지 않는다.')],['돌아간다',close]])
 }]);
 buttons.push(['돌아간다',close]);panel('달 그림','<p>낡은 달 그림이 걸려 있다. 액자 뒤편에 뭔가 끼어 있는 것 같지만 정확히 보이지 않는다.</p>',buttons)}
function lamp(){showText('낡은 조명','빛이 아주 약하다. 침대 밑은 거의 보이지 않는다.')}
function inspectRibbon(){showText('붉은 리본','붉은 천으로 만든 오래된 리본이다.')}
function endingDictionary(){
 if(sound.enabled)tone(440,.55,.045);
 const entries=Object.entries(dictionary);
 const answered=entries.filter(([w])=>!!(state.translations[w]||'').trim()).length;
 const exact=entries.filter(([w,meaning])=>normalized(state.translations[w])===normalized(meaning) || correct(w)).length;
 const rows=entries.map(([w,meaning])=>{
  const guess=(state.translations[w]||'').trim();
  const match=!!guess && (normalized(guess)===normalized(meaning)||correct(w));
  return `<tr><td data-label="외계어">${esc(w)}</td><td data-label="내 해석">${guess?esc(guess):'<span style="opacity:.55">미기록</span>'}</td><td data-label="정답 사전">${esc(meaning)}</td><td data-label="비교">${guess?(match?'✓ 일치':'△ 비교 필요'):'—'}</td></tr>`;
 }).join('');
 const html=`<p>문 너머로 걸음을 옮긴다. 이제 네가 만든 번역 노트를 정답 사전과 비교할 수 있다.</p><p><strong>기록한 단어 ${answered}/${entries.length}개 · 정답 또는 허용 표현 ${exact}개</strong></p><p class="small">표의 판정은 기본형과 일부 허용 표현을 기준으로 해. △ 표시도 문맥상 타당한 해석일 수 있으니 직접 비교해 봐.</p><div class="ending-table-wrap"><table class="ending-table"><thead style="position:sticky;top:0;background:#332b2b"><tr><th>외계어</th><th>내 해석</th><th>정답 사전</th><th>비교</th></tr></thead><tbody>${rows}</tbody></table></div>`;
 panel('탈출 성공 · 해독 사전',html,[['처음부터 다시',resetGame,true]]);
 document.querySelectorAll('.panel th,.panel td').forEach(el=>{el.style.padding='9px 7px';el.style.borderBottom='1px solid #554844'});
}
function resetGame(){
 if(sound.enabled)tone(180,.3,.03);
 Object.assign(state,{doorSeen:false,requestHeard:false,bookSeen:false,bookPagesSeen:new Set(),view:0,met:false,bookPage:0,frame:false,ribbon:false,given:false,key:false,escaped:false,firstVoice:false,translations:{},notes:[],talkCount:0});
 previousScreen=null;close();render();
 // 새 게임은 첫 목소리 이벤트부터 다시 시작한다. 이전 플레이 상태는 전부 초기화한다.
 state.firstVoice=true;state.view=1;render();
 panel('침대 밑의 목소리','<p>“...꿣, 졷... 뮨.”</p><p>알아들을 수 없는 소리가 들리자, 반사적으로 침대 쪽으로 시선이 움직인다.</p>',[['누가 있는 거야?',()=>{close();monster()},true]]);
}
function examiner(){
 if(gameMode!=='easy')return;
 const recorded=Object.entries(state.translations).filter(([w,v])=>Object.prototype.hasOwnProperty.call(dictionary,w) && String(v).trim());
 const ok=recorded.filter(([w])=>normalized(state.translations[w])===normalized(dictionary[w])||correct(w)).length;
 const wrong=recorded.length-ok;
 const root=$('overlay-root');
 root.innerHTML=`<div class="overlay printer-overlay"><div class="printer-panel" role="dialog" aria-modal="true" aria-label="기록 판독기"><h1>UNKNOWN ENTITY · ARCHIVIST-07</h1><div class="printer-description" id="printer-message">낡은 기계가 당신의 해독 노트를 바라본다.<br>기계는 아무 말도 하지 않는다.</div><div class="printer-figure" role="img" aria-label="눈이 빛나는 오래된 프린터 모양의 기계"><div class="antenna"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div><div class="upper"><div class="face"><div class="eye"></div><div class="eye"></div></div></div><div class="body"><div class="plate">ARCHIVIST-07</div><div class="led"></div><div class="slot"></div></div><div class="paper" id="printer-paper"><div class="receipt-head">DECODING REPORT</div><div class="examiner-result">O: ${ok} &nbsp; X: ${wrong}</div><div class="receipt-foot">${recorded.length} WORDS · NO EXPLANATION</div></div></div><div class="printer-controls"><button id="printer-submit">해독 노트 건네기</button><button id="printer-close">돌아가기</button></div></div></div>`;
 document.getElementById('printer-close').onclick=close;
 document.getElementById('printer-submit').onclick=()=>{
  const btn=document.getElementById('printer-submit');btn.disabled=true;btn.textContent='판독 중…';
  document.getElementById('printer-message').innerHTML='철컥. 기계가 노트를 가져간다.<br>안쪽에서 톱니바퀴가 돌아간다…';
  setTimeout(()=>{
   if(!document.getElementById('printer-paper'))return;
   document.getElementById('printer-paper').classList.add('printed');
   document.getElementById('printer-message').innerHTML='기계가 짧은 종이를 토해낸다.<br>어떤 단어가 틀렸는지는 알려주지 않는다.';
   btn.textContent='판독 완료';
  },750);
 };
}
function door(){if(state.key){state.escaped=true;endingDictionary()}else {state.doorSeen=true;note('정면 문에는 열쇠 구멍이 있다.');showText('잠긴 문','굳게 잠겨 있다. 손잡이를 돌려도 열리지 않는다. 열쇠가 필요할 것 같다.')}}
function notes(){saveScreen('notes');let keys=Object.keys(state.translations);let entries=keys.length?keys.map(k=>`<button data-edit="${esc(k)}"><strong>${esc(k)}</strong> → ${esc(state.translations[k])}</button>`).join(''):'<p class="small">아직 번역한 단어가 없어. NPC 대화나 그림책의 기호를 눌러 봐.</p>';panel('나의 해독 노트',`<p class="small">네가 적은 뜻이 모든 대화와 책에 적용돼. 언제든 수정할 수 있어.</p><div class="lexicon">${entries}</div><hr style="border:0;border-top:1px solid #5e5350;margin:20px 0"><p class="small">관찰 메모</p><p class="small">${state.notes.map(x=>'• '+esc(x)).join('<br>')||'아직 없음'}</p>`,[['닫기',close]]);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editWord(b.dataset.edit))}
window.examiner=examiner;window.door=door;window.monster=monster;window.book=book;window.picture=picture;window.lamp=lamp;window.inspectRibbon=inspectRibbon;window.showText=showText;
$('left').onclick=()=>look(state.view+1);$('right').onclick=()=>look(state.view-1);$('center').onclick=()=>look(0);$('notebook').onclick=notes;render();
function lobbySection(name){document.querySelectorAll('.lobby-section').forEach(el=>el.classList.toggle('active',el.id==='lobby-'+name))}
$('lobby-start').onclick=()=>lobbySection('modes');
$('lobby-settings-btn').onclick=()=>lobbySection('settings');
document.querySelectorAll('[data-lobby-back]').forEach(b=>b.onclick=()=>lobbySection('home'));
function applyVolumes(){sound.bgmVolume=Number($('bgm-volume').value)/100;sound.sfxVolume=Number($('sfx-volume').value)/100;$('bgm-value').textContent=Math.round(sound.bgmVolume*100)+'%';$('sfx-value').textContent=Math.round(sound.sfxVolume*100)+'%';if(sound.bgmGain)sound.bgmGain.gain.value=sound.bgmVolume;if(sound.sfxGain)sound.sfxGain.gain.value=sound.sfxVolume}
$('bgm-volume').oninput=applyVolumes;$('sfx-volume').oninput=applyVolumes;
function beginMode(mode){gameMode=mode;$('lobby').classList.add('hidden');$('intro').remove();setSound(true);applyVolumes();resetGame()}
$('mode-easy').onclick=()=>beginMode('easy');
$('mode-normal').onclick=()=>beginMode('normal');
$('lobby-exit').onclick=()=>{window.close();$('lobby-exit-msg').textContent='브라우저가 창 닫기를 막았다면 탭을 직접 닫아줘.'};
</script></body></html>
